name: build-windows-exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build exe
        run: pyinstaller build.spec --noconfirm --clean

      - name: Rename exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist -Filter *.exe | Select-Object -First 1
          $newName = "DualCatPet-v${{ github.run_number }}.exe"
          Copy-Item $exe.FullName "dist\$newName"
          Write-Host "Built: dist\$newName"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DualCatPet-exe
          path: dist/*.exe
          if-no-files-found: error

      - name: Create release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: 双猫桌面宠物 v${{ github.run_number }}
          files: dist/DualCatPet-v*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
